name: Feature Request
description: Propose a new contract capability, testing improvement, or contributor workflow enhancement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What protocol or contributor problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the contract behavior, architecture, or workflow you want.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the outcomes that would make this complete.
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Link related contracts, tests, or prior art if helpful.
